# Complete pipeline configuration, read by scripts/04_run_pipeline.py (--config, default this file).
# Any command-line option given explicitly overrides the value here.
# Units: distances in pixels (130 nm/px in the PSF models), gaps and durations in frames.

# Model paths
models:
  decode: checkpoints/decode/best_model.pth
  magik: checkpoints/magik/best_model.pth

# Detection parameters
detection:
  threshold: 0.5  # Detection probability threshold
  min_photons: 100  # Minimum photon count (DECODE photon estimate); fainter detections are dropped

# Tracking parameters
tracking:
  # Keep max_frame_gap equal to the gap MAGIK was trained with (configs/magik_training.yaml
  # data.max_temporal_gap = 2): the temporal gap is one of MAGIK's edge features, so edges spanning more frames than
  # in training get feature values the network never saw, and its link probabilities for them are not calibrated.
  # Gap filling (08_fill_track_gaps.py, 09 --use_gap_filling) joins fragments across longer gaps without MAGIK.
  # Change both values together if MAGIK is retrained with another gap.
  max_frame_gap: 2  # Maximum frames to link across (= MAGIK training gap, max_temporal_gap 2)
  max_distance: 10.0  # Maximum spatial distance (pixels)
  link_threshold: 0.5  # MAGIK probability threshold for linking

# Calcium analysis parameters
calcium:
  roi_size: 5  # ROI size (5x5 pixels), odd
  baseline_method: percentile  # or 'rolling'
  baseline_percentile: 10.0  # For percentile method

  # Event detection
  event_threshold: 2.0  # Detection threshold (× robust noise σ = 1.4826·MAD, above the median of ΔF/F₀)
  min_duration: 2  # Minimum event duration (frames)
  min_distance: 5  # Minimum distance between events (frames)

# Output options
output:
  save_tracks: true
  save_calcium_traces: true
  save_events: true

# Processing
processing:
  device: cuda  # preferred device: cuda, mps or cpu (falls back to what is available)
